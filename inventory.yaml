# inventory.yaml
# Inventaire externalisé du réseau campus multi-sites.
# Ajouter un site = ajouter un bloc ici, sans toucher au code (src/*.py).

settings:
  eigrp_as: 100
  backup_dir: backups/
  log_dir: logs/
  ssh_port: 22
  device_timeout: 20

sites:
  - name: Dakar
    router: R1-DKR
    host: 192.168.10.1
    device_type: cisco_ios
    vlan: 10
    network: 10.10.10.0/24
    gateway: 10.10.10.1
    switches:
      - name: SW1-CORE
        host: 192.168.10.11
        device_type: cisco_ios
        role: coeur
        access_ports: []
      - name: SW3-ACC
        host: 192.168.10.13
        device_type: cisco_ios
        role: acces
        access_ports: ["Ethernet0/1", "Ethernet0/2"]

  - name: Abidjan
    router: R2-ABJ
    host: 192.168.10.2
    device_type: cisco_ios
    vlan: 20
    network: 10.20.20.0/24
    gateway: 10.20.20.1
    switches:
      - name: SW2-CORE
        host: 192.168.10.12
        device_type: cisco_ios
        role: coeur
        access_ports: []
      - name: SW4-ACC
        host: 192.168.10.14
        device_type: cisco_ios
        role: acces
        access_ports: ["Ethernet0/1", "Ethernet0/2"]

  - name: Saint-Louis
    router: R3-SL
    host: 192.168.10.3
    device_type: cisco_ios
    vlan: 30
    network: 10.30.30.0/24
    gateway: 10.30.30.1
    switches:
      - name: SW5-ACC
        host: 192.168.10.15
        device_type: cisco_ios
        role: acces
        access_ports: ["Ethernet0/1", "Ethernet0/2"]

backbone:
  network: 192.168.10.0/24
  description: "Backbone WAN commun aux 3 sites (sert aussi de réseau de management)"
